# Sapira OpenTelemetry Collector — the hermes-agent-service deployment.
#
# Copied from sapira-blueprints/blueprints/otel-collector; see ORIGIN.md for the commit.
# Everything below that differs from the blueprint is explained where it differs.
#
# Two things stay load-bearing through any further adaptation:
#   1. Redaction runs BEFORE sampling and batching.
#   2. The ledger pipeline has NO sampler.

receivers:
  otlp:
    protocols:
      # `[::]`, not the blueprint's `0.0.0.0`. Railway's private network is IPv6-only, and on Linux
      # a listener bound to 0.0.0.0 does not accept IPv6 at all — the collector would start, pass
      # every local check, and refuse every connection Hermes makes to it. `[::]` is dual-stack.
      grpc:
        endpoint: "[::]:4317"
      http:
        endpoint: "[::]:4318"

connectors:
  # NOT in the blueprint, and the blueprint is wrong without it.
  #
  # A receiver fans out to EVERY pipeline that lists it, so the blueprint's `traces` and
  # `traces/ledger` — both reading `[otlp]` — each received every span. One span posted to a local
  # 0.160.0 with the blueprint config verbatim produced two exports of one span. That defeats both
  # halves of the design at once: the sampler is bypassed, because 100% of traffic still reaches the
  # store down the unsampled ledger path, and every ledger entry is duplicated into the sampled one.
  #
  # A connector is the fix: one ingress pipeline receives, and routes each span to exactly one of
  # the two egress pipelines.
  routing:
    default_pipelines: [traces/app]
    # A span whose route cannot be evaluated goes to the default rather than being dropped. The
    # ledger route is the narrow one; defaulting into it would be the dangerous direction.
    error_mode: ignore
    table:
      - context: span
        condition: instrumentation_scope.name == "@ai-sapira/action-ledger"
        pipelines: [traces/ledger]

processors:
  # First in every pipeline. A collector that dies under load takes the telemetry with it, and the
  # outage it was meant to show you is the one it misses.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  # --- generated by @ai-sapira/otel-redaction 0.2.0 — regenerate, do not hand-edit ---
  # $ node -e "import('@ai-sapira/otel-redaction').then(m => console.log(m.renderCollectorProcessors()))"
  # BOTH processors below are part of the output, and both are REFERENCED in traces/in below.
  # Until 2026-09-04 this block stopped after `redaction/secrets` and `transform/mask-values` was
  # missing entirely, so the value half of the policy was enforced nowhere -- which is how three
  # live Telegram bot tokens reached the trace store inside `http.url`, a key no key-pattern can
  # see. See acceptance/credential-in-url.sh in the blueprint.
  redaction/secrets:
    allow_all_keys: true
    blocked_key_patterns:
      - "(?i).*api[-_]?key.*"
      - "(?i).*secret.*"
      - "(?i).*password.*"
      - "(?i).*passwd.*"
      - "(?i).*credential.*"
      - "(?i).*authorization.*"
      - "(?i).*session[-_]?token.*"
      - "(?i).*private[-_]?key.*"
      - "(?i).*connection[-_]?string.*"
    ignored_keys:
      - "gen_ai.system_instructions"
      - "gen_ai.input.messages"
      - "gen_ai.output.messages"
      - "gen_ai.tool.definitions"
    summary: debug
  transform/mask-values:
    error_mode: ignore
    trace_statements:
      - context: resource
        statements:
          - replace_all_patterns(attributes, "value", "(?i)\\bBearer\\s+[A-Za-z0-9._~+/-]{16,}={0,2}", "[REDACTED]")
          - replace_all_patterns(attributes, "value", "\\beyJ[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}\\b", "[REDACTED]")
          - replace_all_patterns(attributes, "value", "-----BEGIN[A-Z ]*PRIVATE KEY-----", "[REDACTED]")
          - replace_all_patterns(attributes, "value", "(?i)\\b(?:password|pwd)\\s*=\\s*[^;\\s\"']{4,}", "[REDACTED]")
          - replace_all_patterns(attributes, "value", "(?i)\\b[a-z][a-z0-9+.-]*:\\/\\/[^/\\s:@]+:[^/\\s:@]+@", "[REDACTED]")
          - replace_all_patterns(attributes, "value", "\\b(?:sk|pk|rk|api|key|tok|ghp|gho|ghs|ghu|xox[abprs])[-_][A-Za-z0-9_-]{12,}\\b", "[REDACTED]")
          - replace_all_patterns(attributes, "value", "\\b(?:AKIA|ASIA)[0-9A-Z]{16}\\b", "[REDACTED]")
          - replace_all_patterns(attributes, "value", "\\/bot\\d{6,}:[A-Za-z0-9_-]{30,}", "[REDACTED]")
          - replace_all_patterns(attributes, "value", "(?i)[?&](?:access_?token|api_?key|auth|key|password|secret|sig|signature|token)=[^&\\s\"']{8,}", "[REDACTED]")
      - context: scope
        statements:
          - replace_all_patterns(attributes, "value", "(?i)\\bBearer\\s+[A-Za-z0-9._~+/-]{16,}={0,2}", "[REDACTED]")
          - replace_all_patterns(attributes, "value", "\\beyJ[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}\\b", "[REDACTED]")
          - replace_all_patterns(attributes, "value", "-----BEGIN[A-Z ]*PRIVATE KEY-----", "[REDACTED]")
          - replace_all_patterns(attributes, "value", "(?i)\\b(?:password|pwd)\\s*=\\s*[^;\\s\"']{4,}", "[REDACTED]")
          - replace_all_patterns(attributes, "value", "(?i)\\b[a-z][a-z0-9+.-]*:\\/\\/[^/\\s:@]+:[^/\\s:@]+@", "[REDACTED]")
          - replace_all_patterns(attributes, "value", "\\b(?:sk|pk|rk|api|key|tok|ghp|gho|ghs|ghu|xox[abprs])[-_][A-Za-z0-9_-]{12,}\\b", "[REDACTED]")
          - replace_all_patterns(attributes, "value", "\\b(?:AKIA|ASIA)[0-9A-Z]{16}\\b", "[REDACTED]")
          - replace_all_patterns(attributes, "value", "\\/bot\\d{6,}:[A-Za-z0-9_-]{30,}", "[REDACTED]")
          - replace_all_patterns(attributes, "value", "(?i)[?&](?:access_?token|api_?key|auth|key|password|secret|sig|signature|token)=[^&\\s\"']{8,}", "[REDACTED]")
      - context: span
        statements:
          - replace_all_patterns(attributes, "value", "(?i)\\bBearer\\s+[A-Za-z0-9._~+/-]{16,}={0,2}", "[REDACTED]")
          - replace_all_patterns(attributes, "value", "\\beyJ[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}\\b", "[REDACTED]")
          - replace_all_patterns(attributes, "value", "-----BEGIN[A-Z ]*PRIVATE KEY-----", "[REDACTED]")
          - replace_all_patterns(attributes, "value", "(?i)\\b(?:password|pwd)\\s*=\\s*[^;\\s\"']{4,}", "[REDACTED]")
          - replace_all_patterns(attributes, "value", "(?i)\\b[a-z][a-z0-9+.-]*:\\/\\/[^/\\s:@]+:[^/\\s:@]+@", "[REDACTED]")
          - replace_all_patterns(attributes, "value", "\\b(?:sk|pk|rk|api|key|tok|ghp|gho|ghs|ghu|xox[abprs])[-_][A-Za-z0-9_-]{12,}\\b", "[REDACTED]")
          - replace_all_patterns(attributes, "value", "\\b(?:AKIA|ASIA)[0-9A-Z]{16}\\b", "[REDACTED]")
          - replace_all_patterns(attributes, "value", "\\/bot\\d{6,}:[A-Za-z0-9_-]{30,}", "[REDACTED]")
          - replace_all_patterns(attributes, "value", "(?i)[?&](?:access_?token|api_?key|auth|key|password|secret|sig|signature|token)=[^&\\s\"']{8,}", "[REDACTED]")
      - context: spanevent
        statements:
          - replace_all_patterns(attributes, "value", "(?i)\\bBearer\\s+[A-Za-z0-9._~+/-]{16,}={0,2}", "[REDACTED]")
          - replace_all_patterns(attributes, "value", "\\beyJ[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}\\b", "[REDACTED]")
          - replace_all_patterns(attributes, "value", "-----BEGIN[A-Z ]*PRIVATE KEY-----", "[REDACTED]")
          - replace_all_patterns(attributes, "value", "(?i)\\b(?:password|pwd)\\s*=\\s*[^;\\s\"']{4,}", "[REDACTED]")
          - replace_all_patterns(attributes, "value", "(?i)\\b[a-z][a-z0-9+.-]*:\\/\\/[^/\\s:@]+:[^/\\s:@]+@", "[REDACTED]")
          - replace_all_patterns(attributes, "value", "\\b(?:sk|pk|rk|api|key|tok|ghp|gho|ghs|ghu|xox[abprs])[-_][A-Za-z0-9_-]{12,}\\b", "[REDACTED]")
          - replace_all_patterns(attributes, "value", "\\b(?:AKIA|ASIA)[0-9A-Z]{16}\\b", "[REDACTED]")
          - replace_all_patterns(attributes, "value", "\\/bot\\d{6,}:[A-Za-z0-9_-]{30,}", "[REDACTED]")
          - replace_all_patterns(attributes, "value", "(?i)[?&](?:access_?token|api_?key|auth|key|password|secret|sig|signature|token)=[^&\\s\"']{8,}", "[REDACTED]")
  # --- end generated ---

  # Repairing what zero-code instrumentation gets wrong or cannot know.
  #
  # ENG-STD-0018 §4 again: this is a property of how Hermes is wired, and Hermes is upstream code we
  # do not own, so the only place it can be fixed is here.
  transform/genai:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          # `gen_ai.provider.name` is a LIE on every one of these spans. openai-v2 instruments the
          # SDK, and reports the SDK — so a call Hermes routes to Anthropic through OpenRouter is
          # labelled `openai`. A panel grouped by provider would be wrong in the way that is worst:
          # populated, plausible, and never questioned.
          #
          # `server.address` is what we actually know, so provider is derived from it. The SDK's own
          # claim is kept rather than overwritten silently — a normalisation nobody can see is the
          # same class of problem as the bug it fixes.
          - set(attributes["sapira.gen_ai.provider.reported"], attributes["gen_ai.provider.name"])
              where attributes["gen_ai.operation.name"] != nil
                and attributes["gen_ai.provider.name"] != nil
                and attributes["server.address"] != nil
          #
          # Every clause below is guarded on `gen_ai.operation.name`. Without it the httpx
          # instrumentation's own span for the SAME request — a plain client span to the same host —
          # picks up a `gen_ai.provider.name` it has no business carrying, and the store gains
          # GenAI-shaped rows that are not model calls.
          - set(attributes["gen_ai.provider.name"], "openrouter")
              where attributes["gen_ai.operation.name"] != nil
                and attributes["server.address"] == "openrouter.ai"
          - set(attributes["gen_ai.provider.name"], "omni-route")
              where attributes["gen_ai.operation.name"] != nil
                and attributes["server.address"] == "omniroute-production-f03d.up.railway.app"

          # NOT resolved to a vendor, deliberately. Behind omni-route the upstream is chosen per
          # request by the gateway and is not observable from here. `gen_ai.request.model` carries a
          # vendor prefix (`anthropic/claude-opus-5`) but that is what was ASKED for, not proof of
          # who served it, and treating it as the latter reintroduces the same false confidence.

          # Which contract produced this span. P01 stamps `sapira-otel@<version>+genai.<commit>`,
          # meaning names hand-checked against a pinned upstream registry. These spans have no such
          # claim behind them, so they get a value that deliberately FAILS P01's `isPinned()` regex
          # rather than borrowing its authority. A dashboard can then tell the two sources apart.
          - set(attributes["sapira.semconv.version"], "zero-code-openai-v2@2.4b0")
              where attributes["gen_ai.operation.name"] != nil
                and attributes["sapira.semconv.version"] == nil

          # `sapira.run.id` and `sapira.ledger.key` are NOT set here, and cannot be. They mean
          # "which agent run" and "which ledger entry", and nothing at this layer knows either —
          # inventing them would put a fabricated join key in a store people trust. For zero-code
          # sources the correlation key is the trace id. See README.md.

  # Which Phoenix project a span lands in, and therefore which retention policy applies to it. Set
  # here and never in application code — ENG-STD-0018 §4, and the mechanism ENG-ADR-0007 recorded.
  # The two projects carry the ENG-STD-0020 §2 floors: 30 days for traces, 180 for the ledger.
  resource/app:
    attributes:
      - key: openinference.project.name
        value: default
        action: upsert

  resource/ledger:
    attributes:
      - key: openinference.project.name
        value: sapira-ledger
        action: upsert

  # Cost lever. One number, per client, no code change (ENG-STD-0018 §4).
  #
  # 100 while this deployment has one agent on it and the question is whether anything arrives at
  # all. A rate that drops nine spans in ten cannot be told apart from a broken exporter.
  probabilistic_sampler:
    sampling_percentage: 100

  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  # exporters/portable.yaml, resolved. ENG-ADR-0007 decided the destination: Arize Phoenix,
  # self-hosted, reached here over Railway's private network so the traces never leave the project.
  #
  # SAPIRA_OTLP_AUTH_HEADER is the COMPLETE header value ("Bearer <token>"), not a bare token.
  # `otlp_http`, not `otlphttp`: 0.160.0 warns on the old alias at every start.
  otlp_http:
    endpoint: ${env:SAPIRA_OTLP_ENDPOINT}
    headers:
      authorization: ${env:SAPIRA_OTLP_AUTH_HEADER}
    retry_on_failure:
      enabled: true
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      queue_size: 1000

extensions:
  # Gives Railway something to healthcheck. Without it a crash-looping collector reads as healthy,
  # and a telemetry pipeline that fails silently is worse than none.
  health_check:
    endpoint: "[::]:13133"

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
  pipelines:
    # Ingress. Receives everything once, cleans it, and hands each span to exactly one egress.
    # Redaction sits here rather than downstream so it runs before sampling and batching for both
    # routes, which is the ordering the blueprint calls load-bearing.
    traces/in:
      receivers: [otlp]
      processors: [memory_limiter, redaction/secrets, transform/mask-values, transform/genai]
      exporters: [routing]

    # Sampled. The expensive class.
    traces/app:
      receivers: [routing]
      processors: [resource/app, probabilistic_sampler, batch]
      exporters: [otlp_http]

    # NOT sampled. ENG-STD-0019 §5: a ledger entry must never be sampled away. Sampling a trace
    # loses a diagnostic; sampling a ledger entry means that for some proportion of the things the
    # system did to a client's world, there is no record at all.
    #
    # NOTHING REACHES THIS PIPELINE TODAY. @ai-sapira/action-ledger writes to a LedgerStore, not to
    # OTLP, so no span has ever carried that scope name. The route is here because the pipeline it
    # protects is here; see README.md, "The ledger route is not reachable yet".
    traces/ledger:
      receivers: [routing]
      processors: [resource/ledger, batch]
      exporters: [otlp_http]

    # NO METRICS PIPELINE. Phoenix is a trace store and answers /v1/metrics with 405, so this
    # pipeline existed only to export, be refused, and drop -- and to fill the log with the
    # failure. Removing it means the OTLP receiver REJECTS metrics outright, which is the loud
    # version of the same truth: this collector has nowhere to send them.
    #
    # ENG-STD-0018 covers metrics and ENG-STD-0020 §2 floors them at 90 days, so the gap is real.
    # ENG-ADR-0007 chose a trace store; no decision has chosen a metrics store. Restore this
    # pipeline with that decision, not before it.
