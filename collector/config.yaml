# Sapira OpenTelemetry Collector — the hermes-agent-service deployment.
#
# Copied from sapira-blueprints/blueprints/otel-collector; see ORIGIN.md for the commit.
# Everything below that differs from the blueprint is explained where it differs.
#
# Two things stay load-bearing through any further adaptation:
#   1. Redaction runs BEFORE sampling and batching.
#   2. The ledger pipeline has NO sampler.

receivers:
  otlp:
    protocols:
      # `[::]`, not the blueprint's `0.0.0.0`. Railway's private network is IPv6-only, and on Linux
      # a listener bound to 0.0.0.0 does not accept IPv6 at all — the collector would start, pass
      # every local check, and refuse every connection Hermes makes to it. `[::]` is dual-stack.
      grpc:
        endpoint: "[::]:4317"
      http:
        endpoint: "[::]:4318"

connectors:
  # NOT in the blueprint, and the blueprint is wrong without it.
  #
  # A receiver fans out to EVERY pipeline that lists it, so the blueprint's `traces` and
  # `traces/ledger` — both reading `[otlp]` — each received every span. One span posted to a local
  # 0.160.0 with the blueprint config verbatim produced two exports of one span. That defeats both
  # halves of the design at once: the sampler is bypassed, because 100% of traffic still reaches the
  # store down the unsampled ledger path, and every ledger entry is duplicated into the sampled one.
  #
  # A connector is the fix: one ingress pipeline receives, and routes each span to exactly one of
  # the two egress pipelines.
  routing:
    default_pipelines: [traces/app]
    # A span whose route cannot be evaluated goes to the default rather than being dropped. The
    # ledger route is the narrow one; defaulting into it would be the dangerous direction.
    error_mode: ignore
    table:
      - context: span
        condition: instrumentation_scope.name == "@ai-sapira/action-ledger"
        pipelines: [traces/ledger]

processors:
  # First in every pipeline. A collector that dies under load takes the telemetry with it, and the
  # outage it was meant to show you is the one it misses.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  # --- generated by @ai-sapira/otel-redaction — regenerate, do not hand-edit ---
  # $ node -e "import('@ai-sapira/otel-redaction').then(m => console.log(m.renderCollectorProcessors()))"
  redaction/secrets:
    allow_all_keys: true
    blocked_key_patterns:
      - "(?i).*api[-_]?key.*"
      - "(?i).*secret.*"
      - "(?i).*password.*"
      - "(?i).*passwd.*"
      - "(?i).*credential.*"
      - "(?i).*authorization.*"
      - "(?i).*session[-_]?token.*"
      - "(?i).*private[-_]?key.*"
      - "(?i).*connection[-_]?string.*"
    ignored_keys:
      - "gen_ai.system_instructions"
      - "gen_ai.input.messages"
      - "gen_ai.output.messages"
      - "gen_ai.tool.definitions"
    summary: debug
  # --- end generated ---

  # Which Phoenix project a span lands in, and therefore which retention policy applies to it. Set
  # here and never in application code — ENG-STD-0018 §4, and the mechanism ENG-ADR-0007 recorded.
  # The two projects carry the ENG-STD-0020 §2 floors: 30 days for traces, 180 for the ledger.
  resource/app:
    attributes:
      - key: openinference.project.name
        value: default
        action: upsert

  resource/ledger:
    attributes:
      - key: openinference.project.name
        value: sapira-ledger
        action: upsert

  # Cost lever. One number, per client, no code change (ENG-STD-0018 §4).
  #
  # 100 while this deployment has one agent on it and the question is whether anything arrives at
  # all. A rate that drops nine spans in ten cannot be told apart from a broken exporter.
  probabilistic_sampler:
    sampling_percentage: 100

  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  # exporters/portable.yaml, resolved. ENG-ADR-0007 decided the destination: Arize Phoenix,
  # self-hosted, reached here over Railway's private network so the traces never leave the project.
  #
  # SAPIRA_OTLP_AUTH_HEADER is the COMPLETE header value ("Bearer <token>"), not a bare token.
  # `otlp_http`, not `otlphttp`: 0.160.0 warns on the old alias at every start.
  otlp_http:
    endpoint: ${env:SAPIRA_OTLP_ENDPOINT}
    headers:
      authorization: ${env:SAPIRA_OTLP_AUTH_HEADER}
    retry_on_failure:
      enabled: true
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      queue_size: 1000

extensions:
  # Gives Railway something to healthcheck. Without it a crash-looping collector reads as healthy,
  # and a telemetry pipeline that fails silently is worse than none.
  health_check:
    endpoint: "[::]:13133"

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
  pipelines:
    # Ingress. Receives everything once, cleans it, and hands each span to exactly one egress.
    # Redaction sits here rather than downstream so it runs before sampling and batching for both
    # routes, which is the ordering the blueprint calls load-bearing.
    traces/in:
      receivers: [otlp]
      processors: [memory_limiter, redaction/secrets]
      exporters: [routing]

    # Sampled. The expensive class.
    traces/app:
      receivers: [routing]
      processors: [resource/app, probabilistic_sampler, batch]
      exporters: [otlp_http]

    # NOT sampled. ENG-STD-0019 §5: a ledger entry must never be sampled away. Sampling a trace
    # loses a diagnostic; sampling a ledger entry means that for some proportion of the things the
    # system did to a client's world, there is no record at all.
    #
    # NOTHING REACHES THIS PIPELINE TODAY. @ai-sapira/action-ledger writes to a LedgerStore, not to
    # OTLP, so no span has ever carried that scope name. The route is here because the pipeline it
    # protects is here; see README.md, "The ledger route is not reachable yet".
    traces/ledger:
      receivers: [routing]
      processors: [resource/ledger, batch]
      exporters: [otlp_http]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http]
